}

function openAvatarPicker() {
    showModal(`
        <h3 class="modal-title">Avatar tanlang</h3>
        <div class="grid-4" style="gap:8px">
            ${AVATARS.map(a => `
                <button class="game-btn" style="width:100%;height:60px;font-size:28px;background:var(--bg-3);${a === state.user.avatar ? 'border:2px solid var(--primary)' : ''}" onclick="setAvatar('${a}')">
                    ${a}
                </button>
            `).join('')}
        </div>
        <button class="btn btn-ghost btn-block" style="margin-top:16px" onclick="closeModal()">Bekor</button>
    `);
}

function setAvatar(a) {
    state.user.avatar = a;
    LS.set('user', state.user);
    closeModal();
    toast('✅ Avatar yangilandi', 'success');
    render();
}

function logout() {
    if (!confirm('Chiqasizmi?')) return;
    LS.del('user');
    state.user = null;
    state.view = 'feed';
    render();
}

/* ============================================================================
   SECTION 23: SEARCH VIEW
   ============================================================================ */

function renderSearchView() {
    const q = state.searchQuery.toLowerCase().trim();
    let results = [];

    if (q) {
        const posts = LS.get('posts', []);
        results = posts.filter(p =>
            p.text.toLowerCase().includes(q) ||
            (p.tags || []).some(t => ('#' + t).toLowerCase().includes(q))
        );
    }

    return `
        <div style="max-width:760px;margin:0 auto">
            <div class="search-bar">
                <button class="btn btn-ghost btn-sm" onclick="state.view='feed';state.searchQuery='';render()">←</button>
                <input type="text" placeholder="Qidirish..." value="${esc(state.searchQuery)}" oninput="state.searchQuery=this.value;render()" autofocus>
            </div>

            <h3 style="font-size:16px;font-weight:800;margin-bottom:12px">
                "${esc(state.searchQuery)}" uchun natijalar
            </h3>

            ${results.length === 0
                ? renderEmpty('🔍', 'Hech narsa topilmadi')
                : results.map(p => renderPost(p)).join('')
            }
        </div>
    `;
}

/* ============================================================================
   SECTION 24: MODAL SYSTEM
   ============================================================================ */

function showModal(html) {
    const root = $('#modal-root');
    if (!root) return;
    root.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal">${html}</div>
        </div>
    `;
}

function closeModal() {
    const root = $('#modal-root');
    if (root) root.innerHTML = '';
}

/* ============================================================================
   SECTION 25: EMPTY STATE
   ============================================================================ */

function renderEmpty(icon, text) {
    return `
        <div class="empty-state">
            <div class="empty-icon">${icon}</div>
            <div class="empty-text">${esc(text)}</div>
        </div>
    `;
}

/* ============================================================================
   SECTION 26: KEYBOARD SHORTCUTS
   ============================================================================ */

document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        if (e.key === 'Escape') e.target.blur();
        return;
    }

    if (e.key === 'Escape') {
        closeModal();
        return;
    }

    if (!state.user) return;

    // Quick navigation
    if (e.key === 'g') {
        state._gPressed = true;
        setTimeout(() => state._gPressed = false, 800);
        return;
    }

    if (state._gPressed) {
        const routes = {
            'f': 'feed',
            't': 'trend',
            'c': 'crypto',
            'a': 'ai',
            'g': 'games',
            'p': 'profile'
        };
        if (routes[e.key]) {
            navigate(routes[e.key]);
            state._gPressed = false;
        }
    }
});

/* ============================================================================
   SECTION 27: BOOT
   ============================================================================ */

// Start the app
init();

// Handle initial hash routing (if any)
if (window.location.hash) {
    const hash = window.location.hash.slice(1);
    if (state.user) {
        const validRoutes = ['feed', 'trend', 'crypto', 'ecommerce', 'ai', 'games', 'leaderboard', 'streams', 'subscriptions', 'profile', 'settings'];
        if (validRoutes.includes(hash)) {
            state.view = hash;
            render();
        }
    }
}
